version: '3.8'

services:
  # 1. BASE DE DATOS POSTGRESQL
  db-pollito:
    image: postgres:15-alpine
    container_name: pollito_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: don_pollito_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BROKER MQTT (MOSQUITTO)
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: pollito_mosquitto
    restart: always
    ports:
      - "1883:1883" # Puerto para los sensores (ESP32/Arduino)
      - "9001:9001" # Puerto WebSockets para conectar tu React directamente si lo necesitas
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

# Aquí definimos los "Discos Duros" virtuales para no perder los datos al apagar la PC
volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log: